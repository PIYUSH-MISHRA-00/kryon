include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Kryon executes programs. That is the product, not an oversight.
    todo: ignore

linter:
  rules:
    - prefer_final_locals
    - avoid_print
    - unawaited_futures
    - always_declare_return_types
