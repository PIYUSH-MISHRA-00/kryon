name: CI

on:
  push:
    branches: [main, python, javascript, dart, java, kotlin]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Conformance corpus is valid
        run: python scripts/check_corpus.py

      - name: No secrets committed
        run: python scripts/check_secrets.py

      - name: Documentation links resolve
        run: python scripts/check_links.py

  python:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
        include:
          # The full version sweep runs on Linux; the other platforms exist to catch
          # platform differences, not interpreter differences.
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.14" }
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Format
        run: python -m ruff format --check .

      - name: Type check
        run: python -m mypy
        # mypy needs a modern interpreter to run; it still checks for 3.9 compatibility.
        if: matrix.python != '3.9'

      - name: Test
        run: python -m pytest -ra

  python-package:
    name: Python package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build
        run: python -m pip install build twine && python -m build

      - name: Validate metadata
        run: python -m twine check dist/*

      - name: Install the wheel into a clean environment and use it
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/python -c "
          import kryon
          r = kryon.Runtime(encoding='utf-8').execute('python', ['-c', 'print(\"installed ok\")'])
          assert r.ok and r.stdout.strip() == 'installed ok', r
          print('wheel works:', kryon.__version__)
          "

      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: python/dist/

  website:
    name: Website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the site
        run: python scripts/check_website.py

  sdk-status:
    name: SDK status
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report which SDKs are implemented
        run: |
          echo "### SDK implementation status" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| SDK | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for sdk in python javascript dart java kotlin; do
            if [ -d "$sdk" ]; then
              echo "| $sdk | implemented — tested in this run |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| $sdk | **not implemented** — nothing was tested |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "A missing SDK reports as not implemented rather than passing vacuously." >> "$GITHUB_STEP_SUMMARY"
          echo "A green check that means 'we tested nothing' is worse than a missing check." >> "$GITHUB_STEP_SUMMARY"
