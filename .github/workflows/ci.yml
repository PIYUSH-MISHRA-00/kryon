name: CI

on:
  push:
    branches: [main, python, javascript, dart, java, kotlin]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Two conformance cases assert that a child inherits a variable from its parent. Dart and
  # the JVM cannot set their own process environment, so their runners skip those cases with
  # a reason unless it is already present. Setting it here is what makes them run in CI.
  # See spec/conformance.md §3.2.
  KRYON_CONFORMANCE_INHERITED: from-parent

jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Conformance corpus is valid
        run: python scripts/check_corpus.py

      - name: No secrets committed
        run: python scripts/check_secrets.py

      - name: Documentation links resolve
        run: python scripts/check_links.py

      - name: Versions agree across every package
        run: python scripts/check_versions.py

  python:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
        include:
          # The full version sweep runs on Linux; the other platforms exist to catch
          # platform differences, not interpreter differences.
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.14" }
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Format
        run: python -m ruff format --check .

      - name: Type check
        run: python -m mypy
        # mypy needs a modern interpreter to run; it still checks for 3.9 compatibility.
        if: matrix.python != '3.9'

      - name: Test
        run: python -m pytest -ra

  typescript:
    name: TypeScript Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["20", "24"]
        exclude:
          - { os: macos-latest, node: "20" }
          - { os: windows-latest, node: "20" }
        include:
          - { os: ubuntu-latest, node: "22" }
    defaults:
      run:
        working-directory: javascript
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install
        run: npm install

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        # Explicit files rather than a glob: Node 20's --test does not expand one,
        # and the pattern reaches it as a literal path that does not exist.
        run: node --test test/api.test.mjs test/conformance.test.mjs

  dart:
    name: Dart on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: dart
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install
        run: dart pub get

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Format
        run: dart format --output=none --set-exit-if-changed .

      - name: Test
        run: dart test --timeout 120s

      - name: Package validation
        run: dart pub publish --dry-run
        if: matrix.os == 'ubuntu-latest'

  jvm:
    name: ${{ matrix.sdk }} JDK ${{ matrix.java }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        sdk: [java, kotlin]
        os: [ubuntu-latest, macos-latest, windows-latest]
        java: ["21"]
        include:
          - { sdk: java, os: ubuntu-latest, java: "17" }
          - { sdk: kotlin, os: ubuntu-latest, java: "17" }
    defaults:
      run:
        working-directory: ${{ matrix.sdk }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build --no-daemon

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ${{ matrix.sdk }}-test-report-${{ matrix.os }}-${{ matrix.java }}
          path: ${{ matrix.sdk }}/build/reports/tests/

  packages:
    name: Package builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Python — build and validate
        run: |
          cd python
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Python — install the wheel into a clean environment and use it
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install python/dist/*.whl
          /tmp/clean/bin/python -c "
          import kryon
          r = kryon.Runtime(encoding='utf-8').execute('python', ['-c', 'print(\"installed ok\")'])
          assert r.ok and r.stdout.strip() == 'installed ok', r
          print('wheel works:', kryon.__version__)
          "

      - name: TypeScript — pack and inspect
        run: |
          cd javascript
          npm install
          npm run build
          npm pack --dry-run
          node -e "
          const { execSync } = require('node:child_process');
          const files = JSON.parse(execSync('npm pack --json --dry-run'))[0].files.map(f => f.path);
          const required = ['dist/index.js', 'dist/index.d.ts', 'dist/browser.js', 'README.md', 'LICENSE'];
          const missing = required.filter(f => !files.includes(f));
          if (missing.length) { console.error('missing from the tarball:', missing); process.exit(1); }
          if (files.some(f => f.startsWith('src/'))) { console.error('source leaked into the tarball'); process.exit(1); }
          console.log('tarball contains', files.length, 'files');
          "

      - name: Dart — validate
        run: cd dart && dart pub get && dart pub publish --dry-run

      - name: Java — build publishable artifacts
        run: cd java && ./gradlew publishAllPublicationsToStagingRepository --no-daemon

      - name: Kotlin — build publishable artifacts
        run: cd kotlin && ./gradlew publishAllPublicationsToStagingRepository --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            python/dist/
            java/build/staging-deploy/
            kotlin/build/staging-deploy/

  website:
    name: Website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the site
        run: python scripts/check_website.py

  conformance-summary:
    name: Conformance summary
    runs-on: ubuntu-latest
    needs: [python, typescript, dart, jvm]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Report which SDKs ran the corpus
        run: |
          {
            echo "### Conformance"
            echo
            echo "Every SDK below ran the same corpus from \`tests/conformance/cases.json\`."
            echo
            echo "| SDK | Result |"
            echo "|---|---|"
            echo "| Python | ${{ needs.python.result }} |"
            echo "| TypeScript | ${{ needs.typescript.result }} |"
            echo "| Dart | ${{ needs.dart.result }} |"
            echo "| Java + Kotlin | ${{ needs.jvm.result }} |"
            echo
            echo "A case an SDK cannot satisfy is skipped **with a reason**, never dropped."
            echo "PTY, terminal emulation and transports are specified and not implemented in any SDK."
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ needs.python.result }}" != "success" ] \
            || [ "${{ needs.typescript.result }}" != "success" ] \
            || [ "${{ needs.dart.result }}" != "success" ] \
            || [ "${{ needs.jvm.result }}" != "success" ]; then
            echo "::error::at least one SDK failed the conformance corpus"
            exit 1
          fi
