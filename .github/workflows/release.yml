name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Which registry to publish (a tag push always publishes all)"
        type: choice
        default: maven-central
        options: [all, pypi, npm, pub-dev, maven-central]

permissions:
  contents: read

env:
  KRYON_CONFORMANCE_INHERITED: from-parent

jobs:
  # ---------------------------------------------------------------- gate
  verify:
    name: Verify the tag is releasable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Every package agrees on the version
        run: python scripts/check_versions.py

      - name: The tag matches that version
        if: github.ref_type == 'tag'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(grep -oP '__version__ = "\K[^"]+' python/src/kryon/__init__.py)
          echo "tag=$tag package=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $pkg."
            echo "::error::A release whose version number is a guess is worse than no release."
            exit 1
          fi

      - name: The changelog has a section for it
        if: github.ref_type == 'tag'
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "::error::No CHANGELOG.md section for $version. Write it before tagging."
            exit 1
          fi

      - name: No secrets committed
        run: python scripts/check_secrets.py

  # ---------------------------------------------------------------- builds
  build:
    name: Build ${{ matrix.sdk }}
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        sdk: [python, javascript, dart, java, kotlin]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        if: matrix.sdk == 'python'
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        if: matrix.sdk == 'javascript'
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - uses: dart-lang/setup-dart@v1
        if: matrix.sdk == 'dart'
        with:
          sdk: stable
      - uses: actions/setup-java@v6
        if: matrix.sdk == 'java' || matrix.sdk == 'kotlin'
        with:
          distribution: temurin
          java-version: "21"

      - name: Python
        if: matrix.sdk == 'python'
        run: |
          cd python
          python -m pip install -e ".[dev]" build twine
          python -m ruff check . && python -m ruff format --check . && python -m mypy
          python -m pytest -ra
          python -m build
          python -m twine check dist/*

      - name: TypeScript
        if: matrix.sdk == 'javascript'
        run: |
          cd javascript
          npm install
          npm run typecheck
          npm run build
          node --test test/api.test.mjs test/conformance.test.mjs
          npm pack

      - name: Dart
        if: matrix.sdk == 'dart'
        run: |
          cd dart
          dart pub get
          dart analyze --fatal-infos
          dart format --output=none --set-exit-if-changed .
          dart test --timeout 120s
          dart pub publish --dry-run

      - name: JVM
        if: matrix.sdk == 'java' || matrix.sdk == 'kotlin'
        run: cd ${{ matrix.sdk }} && ./gradlew build --no-daemon

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.sdk }}
          path: |
            python/dist/
            javascript/*.tgz
            java/build/libs/
            kotlin/build/libs/
          if-no-files-found: ignore

  # ---------------------------------------------------------------- publish
  # Every publish job sits behind a GitHub environment. That is deliberate: it means a
  # release cannot reach a registry without a human approving it, and it is where the
  # credentials live rather than in this file.

  publish-pypi:
    if: github.ref_type == 'tag' || inputs.target == 'all' || inputs.target == 'pypi'
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/kryon
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist-python
          path: staging/
      - run: mkdir -p dist && cp staging/python/dist/* dist/
      # Trusted Publishing: PyPI verifies a signed OIDC assertion from this repository and
      # workflow, so no long-lived token exists to be stolen.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true

  publish-npm:
    if: github.ref_type == 'tag' || inputs.target == 'all' || inputs.target == 'npm'
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/kryon-exec
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Build from source rather than trusting an artifact
        run: cd javascript && npm install && npm run build && node --test test/api.test.mjs test/conformance.test.mjs

      # `--provenance` attaches a signed attestation linking the tarball to this commit and
      # workflow, so anyone can verify where the package came from.
      #
      # NPM_TOKEN is a granular access token scoped to this package. If npm Trusted
      # Publishing is configured for `kryon`, the token becomes unnecessary and the env line
      # below can be deleted -- the OIDC assertion from `id-token: write` is used instead.
      - name: Publish
        run: cd javascript && npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-pub:
    if: github.ref_type == 'tag' || inputs.target == 'all' || inputs.target == 'pub-dev'
    name: Publish to pub.dev
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pub-dev
      url: https://pub.dev/packages/kryon
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Build and test from source
        run: cd dart && dart pub get && dart analyze --fatal-infos && dart test --timeout 120s

      # pub.dev automated publishing uses OIDC and needs no token -- but it must first be
      # enabled on the package's admin page, which requires the package to already exist.
      # The very first publish is therefore manual (`dart pub publish` from a logged-in
      # machine); every release after that runs here.
      - name: Publish
        run: cd dart && dart pub publish --force

  publish-maven:
    if: github.ref_type == 'tag' || inputs.target == 'all' || inputs.target == 'maven-central'
    name: Publish to Maven Central
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: maven-central
      url: https://central.sonatype.com/namespace/io.github.piyush-mishra-00
    strategy:
      # Sequential: two concurrent bundle uploads to the same namespace is asking for a
      # half-published release.
      max-parallel: 1
      matrix:
        sdk: [java, kotlin]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Check the shape of the signing secrets
        run: python scripts/check_signing_secret.py
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}

      - name: Build, sign and stage
        run: cd ${{ matrix.sdk }} && ./gradlew publishAllPublicationsToStagingRepository --no-daemon
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}

      - name: Check the bundle is signed
        run: |
          cd ${{ matrix.sdk }}/build/staging-deploy
          if ! find . -name '*.asc' | grep -q .; then
            echo "::error::no signatures in the bundle. Maven Central will reject it, and an"
            echo "::error::unsigned artifact must never be published as if it were signed."
            exit 1
          fi
          find . -type f | sort

      - name: Upload the bundle to the Central Portal
        run: |
          cd ${{ matrix.sdk }}/build/staging-deploy
          zip -qr ../bundle.zip .
          cd ..
          code=$(curl -sS -o response.txt -w '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer ${{ secrets.CENTRAL_PORTAL_TOKEN }}" \
            --form "bundle=@bundle.zip" \
            "https://central.sonatype.com/api/v1/publisher/upload?name=kryon-${{ matrix.sdk }}-${GITHUB_REF_NAME}&publishingType=USER_MANAGED")
          echo "HTTP $code"
          cat response.txt
          if [ "$code" != "201" ]; then
            echo "::error::Central Portal rejected the bundle"
            exit 1
          fi
          echo "Uploaded. It is staged as USER_MANAGED: review and release it at" >> "$GITHUB_STEP_SUMMARY"
          echo "<https://central.sonatype.com/publishing/deployments>." >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------- release
  github-release:
    if: github.ref_type == 'tag'
    name: GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: artifacts/
          merge-multiple: true

      - name: Extract this version's changelog section
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::No CHANGELOG.md section for $version."
            exit 1
          fi
          cat release-notes.md

      - name: Collect the artifacts
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.whl' -o -name '*.tar.gz' -o -name '*.tgz' -o -name '*.jar' \) \
            -exec cp {} release/ \;
          ls -la release/

      - uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          files: release/*
          draft: true
          fail_on_unmatched_files: false
