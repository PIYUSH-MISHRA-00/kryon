version: 2

# Kryon's Python package has zero runtime dependencies, so the surface here is deliberately
# small: GitHub Actions, and the development tooling. That is the point — there is very
# little to keep current, and nothing in the supply chain of a published wheel.

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci"
    labels: ["dependencies", "ci"]
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /python
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "build"
    labels: ["dependencies", "python"]
    groups:
      dev-tooling:
        patterns: ["*"]
