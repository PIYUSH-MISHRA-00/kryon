version: 2

# Kryon's published packages carry almost no dependencies -- Python, TypeScript, Dart and
# Java have none at all, and Kotlin has exactly one. The surface here is therefore mostly
# development tooling and GitHub Actions, which is the point: there is very little to keep
# current, and nothing in the supply chain of a published artifact except coroutines.

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci"
    labels: ["dependencies", "ci"]
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /python
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "build"
    labels: ["dependencies", "python"]
    groups:
      dev-tooling:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /javascript
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "build"
    labels: ["dependencies", "javascript"]
    groups:
      dev-tooling:
        patterns: ["*"]

  - package-ecosystem: pub
    directory: /dart
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "build"
    labels: ["dependencies", "dart"]
    groups:
      dev-tooling:
        patterns: ["*"]

  - package-ecosystem: gradle
    directory: /java
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "build"
    labels: ["dependencies", "java"]
    groups:
      dev-tooling:
        patterns: ["*"]

  - package-ecosystem: gradle
    directory: /kotlin
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "build"
    labels: ["dependencies", "kotlin"]
    groups:
      dev-tooling:
        patterns: ["*"]
